name: فحص المصادر يومياً

on:
  schedule:
    # يومياً 05:00 بتوقيت الكويت (02:00 UTC) بأمر الدكتور: المادة الخارجية تُنظَّف
    # أولاً بأول فلا يبقى رابط ميت في الموقع. الروابط الخارجية لا تموت
    # فجأة، والفحص الأسبوعي يلتقط الميّت خلال أيام دون إرهاق ولا حذفٍ متسرّع.
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check-curated-links
  cancel-in-progress: false

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Force public npm registry
        run: |
          npm config set registry https://registry.npmjs.org/
          node scripts/normalize-npm-registry.mjs

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org/ --prefer-online --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000

      - name: Self-test link classifier
        run: node scripts/check-curated-links.mjs --self-test

      - name: Write Firebase service account
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > sa.json
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DRAHMAD_8E9E2 }}

      - name: Check curated links and remove dead ones
        run: node scripts/check-curated-links.mjs
        env:
          FIREBASE_PROJECT_ID: drahmad-8e9e2
          FIREBASE_SERVICE_ACCOUNT: sa.json

      - name: Remove temporary credentials
        if: always()
        run: rm -f sa.json

      - name: Commit dead-link blocklist if changed
        run: |
          if ! git diff --quiet -- src/data/curated-dead-links.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/curated-dead-links.json
            git commit -m "chore: prune dead curated links (weekly check)"
            pushed=""
            for attempt in 1 2 3 4 5; do
              if git push; then pushed="نعم"; break; fi
              echo "رُفض الدفع (محاولة ${attempt}/5) — أعيد الأساس فوق آخر main ثم أحاول."
              git pull --rebase --autostash origin main || { echo "تعذّر إعادة الأساس."; exit 1; }
              sleep $((attempt * 5))
            done
            if [ -z "$pushed" ]; then
              echo "::error::رُفض الدفع خمس مرات رغم إعادة الأساس."
              exit 1
            fi
          else
            echo "لا روابط بنكٍ ميتة جديدة."
          fi

      # الفاحص الشامل: كل رابط في الموقع (٢١٦ موضعاً) لا المختارات وحدها،
      # ويكتب تقريراً تفصيلياً تقرؤه اللوحة بدل الحذف الصامت.
      - name: Check every source and clean foreign dead links
        run: node scripts/check-all-sources.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: sa.json
          FIREBASE_PROJECT_ID: drahmad-8e9e2
