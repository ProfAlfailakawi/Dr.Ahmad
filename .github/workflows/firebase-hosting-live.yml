name: نشر الموقع على Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: true

jobs:
  # بوّابةٌ تسبق النشر. أربعة أعطابٍ بلغت الموقع في يومٍ واحد (٢٠ يوليو)
  # وكان لدينا اختبارٌ يمسك كلَّ واحدٍ منها — لكنّ أحداً لا يشغّلها عند الرفع.
  # فوجودُ الاختبار بلا مُشغِّلٍ كعدمه. تُشغَّل هنا كلُّها، وإن احمرّ واحدٌ
  # منها لم تبدأ خطوةُ النشر أصلاً (needs) — لا نشرَ فوق فحصٍ أحمر.
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !/.codex-backups/
            !/*.txt
            !/agent-*.sqlite
            !/audio-meta-*.json
            !/bodies-vocalized-*.json
            !/podcast-state-*.json
            !/whatsapp-agent/*.command
          sparse-checkout-cone-mode: false
          fetch-depth: 0

      - name: حصانة الصوت — استعادة المانيفست من آخر التزام للقافلة قبل أي فحص
        run: |
          # العلاج الجذري: رفعةٌ بشرية من مجلدٍ قديم (GitHub Desktop) كانت تُرجِع
          # audio-meta إلى حالةٍ قديمة فيسقط الفحص النووي ويتعطّل النشر. القافلة
          # هي المصدر الأوثق لملفات الصوت الآلية؛ نستعيد نسختها دائماً قبل الفحص
          # فلا يكسر الموقعَ رفعٌ بشريٌّ أبداً — والصوت في R2 سليمٌ في الحالين.
          LAST=$(git log --format='%H' -n 150 --grep='auto-publish new audio to R2' -- src/data/audio-meta.json | head -1)
          if [ -n "$LAST" ] && [ "$LAST" != "$(git rev-parse HEAD)" ]; then
            git checkout "$LAST" -- src/data/audio-meta.json src/data/audio.json src/data/audio-supervisor.json 2>/dev/null || true
            echo "::notice::استُعيدت ملفات الصوت الآلية من آخر التزام للقافلة ${LAST}"
          else
            echo "ملفات الصوت على أحدث التزام للقافلة — لا حاجة للاستعادة."
          fi

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Force and verify public npm registries
        run: |
          npm config set registry https://registry.npmjs.org/
          node --version
          npm --version
          node scripts/normalize-npm-registry.mjs
          node scripts/normalize-npm-registry.mjs --check

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org/ --prefer-online --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000

      - name: WhatsApp agent
        run: |
          node whatsapp-agent/self-test.mjs
          node whatsapp-agent/scholar.mjs --self-test

      - name: Radar, FAQ and site content
        run: |
          node scripts/daily-radar.mjs --self-test
          node scripts/radar-repair.mjs --self-test
          node scripts/faq-repair.mjs --self-test
          node scripts/auto-site-content.mjs --self-test
          node scripts/idea-life-sync.mjs --self-test
          node scripts/test-social-design-engine.mjs
          node scripts/test-social-templates.mjs
          node scripts/test-studio-image-generation.mjs
          node scripts/test-studio-image-route.mjs

      # حرّاسُ ما أُصلح مؤخّراً: لولاها لعاد كلُّ عطبٍ منها صامتاً كما عاد أوّل مرّة.
      - name: Content, audio and dialogue guards
        run: |
          node scripts/purge-deleted-content.mjs --self-test
          node scripts/guard-audio-meta-regression.mjs --self-test
          node scripts/reconcile-audio-meta.mjs --self-test
          node scripts/explain-failure.mjs --self-test
          node scripts/stage-dialogues-local.mjs --self-test
          node scripts/upload-dialogues.mjs --self-test
          node scripts/audit-article-bodies.mjs --self-test

      - name: TypeScript
        run: npx tsc --noEmit

  build-and-deploy:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !/.codex-backups/
            !/*.txt
            !/agent-*.sqlite
            !/audio-meta-*.json
            !/bodies-vocalized-*.json
            !/podcast-state-*.json
            !/whatsapp-agent/*.command
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Force public npm registry
        run: |
          npm config set registry https://registry.npmjs.org/
          node --version
          npm --version
          node scripts/normalize-npm-registry.mjs
          node scripts/normalize-npm-registry.mjs --check

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org/ --prefer-online --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000

      # بناء الموقع يشغّل self-tests الصوت (audio:quality:self-test) وهي تتحقق من وجود
      # ffmpeg/ffprobe — أزالته دفعة سابقة عن هذا الـworkflow فتعطل النشر كله.
      - name: Install media tools required by build self-tests
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # بلا هذا المفتاح يبني الموقعُ أعمى عن قرارات اللوحة، فتُنشر الصفحات
      # التي حذفها الدكتور بيده وتُفهرَس. المشروع هنا مشروع البيانات
      # (drahmad-8e9e2) لأنه صاحب مجموعة content_overrides.
      - name: Write Firestore key so panel deletions are honored
        run: |
          if [ -z "$FIREBASE_DATA_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_DRAHMAD_8E9E2 غير مضبوط — لا يمكن بناء نشرٍ يحترم الحذف."
            exit 1
          fi
          printf '%s' "$FIREBASE_DATA_SERVICE_ACCOUNT_JSON" > sa.json
        env:
          FIREBASE_DATA_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DRAHMAD_8E9E2 }}

      # الحذف نهائيّ: يُمحى المحذوف من الملفات الأساسية نفسها لا من البناء
      # وحده، فلا تُعيده لقطةٌ ولا دفعةٌ قديمة كما أُعيدت ورقةُ السبورة.
      - name: Purge panel-deleted content from the source files
        run: node scripts/purge-deleted-content.mjs --apply
        env:
          FIREBASE_SERVICE_ACCOUNT: sa.json

      - name: Build static site
        run: npm run build
        env:
          VITE_SITE_URL: https://dr-alfailakawi.com
          AUDIO_PUBLIC_BASE_URL: ${{ vars.AUDIO_PUBLIC_BASE_URL }}
          VITE_AUDIO_BASE_URL: ${{ vars.AUDIO_PUBLIC_BASE_URL }}
          FIREBASE_SERVICE_ACCOUNT: sa.json
          FIREBASE_PROJECT_ID: drahmad-8e9e2
          REQUIRE_PANEL_DECISIONS: '1'

      - name: Remove the Firestore key
        if: always()
        run: rm -f sa.json

      - name: Verify Firebase service account secret
        run: |
          if [ -z '${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEN_LANG_CLIENT_0200723670 }}' ]; then
            echo 'Missing GitHub secret: FIREBASE_SERVICE_ACCOUNT_GEN_LANG_CLIENT_0200723670'
            echo 'Add a Firebase service-account JSON with Hosting Admin permissions to this repository secret.'
            exit 1
          fi

      - name: Verify official-domain build
        run: npm run verify:domain -- --dist

      # كانت الاستضافة تُنشر وحدها بينما تبقى خدمة dr-api على مراجعة قديمة؛
      # النتيجة: الواجهة الجديدة تطلب /api/ai/studio-image والخادم القديم يعيد 404.
      # هذا النشر يحدّث Cloud Run من المصدر نفسه قبل تثبيت Firebase Hosting عليه.
      - name: Authenticate Google Cloud for dr-api
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CLOUD_RUN_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_GEN_LANG_CLIENT_0200723670 }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: gen-lang-client-0200723670

      - name: Deploy and verify the current dr-api revision
        env:
          # Account ID is not a secret. A repository variable/secret overrides this project fallback.
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID || '6267458602007e25acb26f4fa71511c3' }}
          # Rotate the token that appeared in chat, then store the replacement as this repository secret.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            # One guarded operation: live Cloudflare preflight, Secret Manager,
            # current source deployment, environment binding, and route health test.
            bash scripts/configure-cloudflare-workers-ai.sh
          else
            # Never leave the frontend pointing at an old container. Deploy the route even
            # when the one-time Cloudflare repository secret has not been added yet.
            gcloud run deploy dr-api \
              --source . \
              --project gen-lang-client-0200723670 \
              --region europe-west1 \
              --allow-unauthenticated \
              --port 8080 \
              --timeout 60 \
              --memory 1Gi \
              --max-instances 3 \
              --quiet
            echo "::warning::CLOUDFLARE_API_TOKEN is not stored in GitHub Secrets. The 404 is fixed, but image generation will remain unconfigured unless Cloud Run already has the secret."
          fi

          SERVICE_URL="$(gcloud run services describe dr-api \
            --project gen-lang-client-0200723670 \
            --region europe-west1 \
            --format='value(status.url)')"
          test -n "$SERVICE_URL"

          for attempt in {1..12}; do
            if HEALTH="$(curl --fail --silent --show-error --max-time 10 "$SERVICE_URL/api/ai/studio-image/health")"; then
              printf '%s\n' "$HEALTH"
              node -e 'const value=JSON.parse(process.argv[1]); if(!value.ok || value.route!=="/api/ai/studio-image") process.exit(1); if(!value.configured) console.log("::warning::dr-api route is live, but Cloudflare credentials are not configured on this revision.")' "$HEALTH"
              echo "::notice::dr-api image route is live on the new Cloud Run revision."
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "::error::Cloud Run deployed, but the studio image health route did not become reachable."
              exit 1
            fi
            sleep 5
          done

      - name: Deploy Firestore and Storage rules to the data project
        run: |
          cleanup() {
            rm -f "$RUNNER_TEMP/firebase-data-service-account.json"
          }
          trap cleanup EXIT
          if [ -z "$FIREBASE_DATA_SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT_DRAHMAD_8E9E2 is missing; skipping Firestore and Storage rules deploy for the data project."
            echo "::warning::Hosting deploy will continue. Add the secret later to update Inbox/Questions/CMS rules automatically."
            exit 0
          fi
          printf '%s' "$FIREBASE_DATA_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-data-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-data-service-account.json"
          # قواعد Firestore أولاً ومنفصلة: كانت مدموجة مع Storage في أمر واحد، وفشل تفعيل
          # Storage (خدمة غير مفعلة في المشروع) كان يُسقط نشر قواعد Firestore معه —
          # فبقيت قواعد site_cv_files غائبة عن الإنتاج ورفض رفع السيرة بـpermission-denied.
          if ! npx --yes firebase-tools@latest deploy \
            --config firebase.data.json \
            --only firestore:rules \
            --project drahmad-8e9e2 \
            --non-interactive; then
            echo "::error::Firestore rules deploy failed — CV uploads and CMS writes will stay broken until this succeeds."
            exit 1
          fi
          # قواعد Storage اختيارية (نظام السيرة يتعمد عدم الاعتماد على Storage أصلاً)
          if ! npx --yes firebase-tools@latest deploy \
            --config firebase.data.json \
            --only storage \
            --project drahmad-8e9e2 \
            --non-interactive; then
            echo "::warning::Storage rules deploy failed (Storage API likely not enabled). CV uploads do not need it; enable the API later if Storage becomes required."
          fi
        env:
          FIREBASE_DATA_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DRAHMAD_8E9E2 }}

      - name: Deploy to Firebase Hosting live
        run: |
          printf '%s' "$FIREBASE_HOSTING_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-hosting-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-hosting-service-account.json"
          npx --yes firebase-tools@latest deploy \
            --only hosting \
            --project gen-lang-client-0200723670 \
            --non-interactive
          rm -f "$RUNNER_TEMP/firebase-hosting-service-account.json"
        env:
          FIREBASE_HOSTING_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEN_LANG_CLIENT_0200723670 }}

      - name: Verify Firebase-to-Cloud-Run image route
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if HEALTH="$(curl --fail --silent --show-error --max-time 10 'https://dr-alfailakawi.com/api/ai/studio-image/health')"; then
              printf '%s\n' "$HEALTH"
              node -e 'const value=JSON.parse(process.argv[1]); if(!value.ok || value.service!=="dr-api") process.exit(1)' "$HEALTH"
              echo "::notice::Firebase Hosting now reaches the current dr-api image route."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Firebase Hosting still does not reach /api/ai/studio-image after deployment."
          exit 1
