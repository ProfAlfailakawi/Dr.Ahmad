<!doctype html>
<!--
  صفحة «نُحدّث الموقع».

  أثناء النشر قد تجيب واجهةُ Google الأمامية عن فتح صفحةٍ بصفحة خطأٍ إنجليزية
  (500/502/503/504) لم يكتبها الموقع. عاملُ الخدمة (public/sw.js) يحفظ هذه الصفحة
  عند تثبيته، ويقدّمها بدلاً من ذلك الجواب أو من انقطاعٍ والجهازُ متّصل — والرابطُ
  في شريط العنوان يبقى ما طلبه الزائر، فإعادةُ التحميل تفتحه هو نفسه.

  مستقلّةٌ تماماً: لا طلبَ خارجياً، والخطّان خطّا الموقع المحفوظان فيه وإلا خطُّ
  النظام. سياسةُ CSP تمنع السكربت المضمّن، فمنطقُها في /updating.js (يحفظه العامل
  معها). النهار هو الأصل كبقية الموقع، والليل باختيار الزائر وحده (theme-choice).
-->

<title>نُحدّث الموقع · د. أحمد الفيلكاوي</title>

<style>
@font-face{font-family:"El Messiri";font-weight:400 700;font-display:swap;src:url("/fonts/elmessiri-K2F0fZBRmr9vQ1pHEey6MoiAAgDwbWu1jw.woff2") format("woff2")}
@font-face{font-family:"Tajawal";font-weight:400;font-display:swap;src:url("/fonts/tajawal-Iura6YBj_oCad4k1nzSBC5xLhLFw4Q.woff2") format("woff2")}
@font-face{font-family:"Tajawal";font-weight:500;font-display:swap;src:url("/fonts/tajawal-Iurf6YBj_oCad4k1l8KiHrRpiZtK6GwN9w.woff2") format("woff2")}
:root{
  --bg:#FCFCFA;--ink:#15161A;--muted:#5E6570;--line:rgba(21,22,26,.09);
  --accent:#3E5C78;--glow:rgba(62,92,120,.10);--ember:#8F5A28;
  --button:#F4F5F3;--shadow:rgba(21,22,26,.18);
  color-scheme:light;
}
html.dark{
  --bg:#111215;--ink:#ECEAE4;--muted:#B5B8BE;--line:rgba(234,234,231,.11);
  --accent:#84A9CA;--glow:rgba(132,169,202,.14);--ember:#D6B78F;
  --button:#171A1F;--shadow:rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;min-height:100%;display:grid;place-items:center;
  padding:max(24px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));
  background:radial-gradient(circle at 50% 40%,var(--glow),transparent 46%),var(--bg);
  color:var(--ink);
  font-family:"Tajawal",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Arabic",Tahoma,sans-serif;
  font-synthesis:none;-webkit-font-smoothing:antialiased;text-align:center;
}
main{display:grid;justify-items:center;gap:0;max-width:420px;width:100%}
.stage{position:relative;width:132px;height:132px;display:grid;place-items:center;margin-bottom:30px}
.halo{position:absolute;inset:0;width:100%;height:100%;animation:turn 3.6s linear infinite}
.halo circle{fill:none;stroke-width:2;stroke-linecap:round}
.halo .track{stroke:var(--line)}
.halo .arc{stroke:var(--accent);stroke-dasharray:96 400;opacity:.85}
.mark{width:80px;height:48px;display:block;color:var(--ink);filter:drop-shadow(0 14px 24px var(--shadow));animation:breathe 2.4s cubic-bezier(.45,0,.25,1) infinite}
.spark{position:absolute;fill:var(--ember);animation:twinkle 2.4s ease-in-out infinite}
.spark.one{width:20px;height:20px;top:6px;inset-inline-start:8px}
.spark.two{width:12px;height:12px;bottom:14px;inset-inline-end:6px;fill:var(--accent);animation-delay:1.2s}
h1{margin:0;font-family:"El Messiri",serif;font-size:clamp(22px,5.6vw,27px);font-weight:600;line-height:1.5}
.lead{margin:6px 0 0;font-size:16px;line-height:1.7;color:var(--muted)}
.pulse{width:132px;height:2px;margin:26px 0 28px;border-radius:99px;background:var(--line);overflow:hidden}
.pulse i{display:block;width:36%;height:100%;border-radius:inherit;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:scan 1.5s ease-in-out infinite}
button{
  min-height:44px;padding:0 22px;border-radius:12px;cursor:pointer;
  border:1px solid var(--line);background:var(--button);color:var(--ink);
  font:inherit;font-size:14px;font-weight:500;
  transition:border-color .2s ease,transform .2s ease;
}
button:hover{border-color:var(--accent)}
button:active{transform:scale(.98)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.note{min-height:20px;margin:14px 0 0;font-size:12.5px;line-height:1.6;color:var(--muted)}
@keyframes turn{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{opacity:1;transform:none}50%{opacity:.72;transform:scale(.97)}}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7) rotate(0)}50%{opacity:1;transform:scale(1) rotate(20deg)}}
@keyframes scan{0%{transform:translateX(130%)}100%{transform:translateX(-360%)}}
@media (prefers-reduced-motion:reduce){
  .halo,.mark,.spark,.pulse i{animation:none}
  .spark{opacity:.8}
}
</style>
</head>

  </div>
  <h1 id="title">نُحدّث الموقع الآن ✨</h1>
