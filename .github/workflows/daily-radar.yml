name: رادار الدكتور اليومي

on:
  schedule:
    # ثلاث محاولات يومية بتوقيت الكويت: 08:20، 14:20، 20:20.
    # السكربت يمنع التكرار تلقائياً إذا نُشرت صيدة اليوم.
    - cron: '20 5,11,17 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Force public npm registry
        run: |
          npm config set registry https://registry.npmjs.org/
          node scripts/normalize-npm-registry.mjs

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org/ --prefer-online --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000

      - name: Validate radar secrets
        run: |
          if [ -z "$GEMINI_API_KEY" ] && [ -z "$GOOGLE_API_KEY" ]; then
            echo "::warning::GEMINI_API_KEY or GOOGLE_API_KEY is missing; skipping radar quietly."
            exit 0
          fi
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT_DRAHMAD_8E9E2 is missing; skipping radar quietly."
            exit 0
          fi
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DRAHMAD_8E9E2 }}

      - name: Run radar and publish to Firestore
        run: |
          if [ -z "$GEMINI_API_KEY" ] && [ -z "$GOOGLE_API_KEY" ]; then exit 0; fi
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then exit 0; fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > sa.json
          npm run radar
          rm -f sa.json
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          FIREBASE_PROJECT_ID: drahmad-8e9e2
          FIREBASE_SERVICE_ACCOUNT: sa.json
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DRAHMAD_8E9E2 }}
