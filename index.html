    <!--
      أوّل رسمةٍ للزائر: العلامة نفسها التي في public/logo.svg، منسوخةً حرفاً بحرف
      ومضمّنةً في الصفحة — بلا حزمةٍ ولا طلبٍ إضافي، فتظهر قبل أوّل بكسل.
      تُكشف بمسحةٍ من اليمين كاتّجاه الكتابة: الكشف الخلوي القديم كان يُظهر في
      كلّ لحظةٍ مستطيلاتٍ مبعثرةً تُقرأ كشكلٍ غريب لا كعلامة. تنزاح حالما
      يُركّب React (data-app-ready)، ويخفيها غيابُ الصنف «js» وحده إن تعطّل
      JavaScript، فلا تحجب الصفحة الثابتة أبداً.

      ولا تُوضع داخل #root أبداً: createRoot يمسح أبناء حاويته عند التركيب،
