name: إرسال الحوار للتوليد (قرار الإنتاج)

on:
  workflow_dispatch:
    inputs:
      slugs:
        description: 'أسماء الحلقات المفصولة بفواصل (تُرسَل للتوليد)'
        required: true

permissions:
  contents: read

concurrency:
  group: podcast-queue
  cancel-in-progress: false

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org/ --prefer-online --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000
      - name: Write Firebase service account
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || { echo "::error::Firebase service account missing"; exit 1; }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > sa.json
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DRAHMAD_8E9E2 }}
      - name: Queue dialogues for generation
        run: node scripts/queue-dialogues.mjs --slugs="${{ github.event.inputs.slugs }}"
        env:
          FIREBASE_PROJECT_ID: drahmad-8e9e2
          FIREBASE_SERVICE_ACCOUNT: sa.json
      - name: Remove service account
        if: always()
        run: rm -f sa.json
