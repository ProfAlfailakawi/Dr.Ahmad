name: مجلس الفكرة — اعتماد ونشر كويتي

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'slug النسخة الكويتية التي اعتمدها المشرف'
        required: true
      revision_id:
        description: 'revision المرشح الذي سمعه المشرف واعتمده'
        required: true

permissions:
  contents: write

concurrency:
  group: podcast-kuwaiti-promote-${{ inputs.slug }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: |
          npm ci --registry=https://registry.npmjs.org/ --prefer-online
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --user awscli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Resolve approved identity
        shell: bash
        run: |
          set -euo pipefail
          SLUG="$(echo '${{ inputs.slug }}' | tr -d '[:space:]')"
          REVISION="$(echo '${{ inputs.revision_id }}' | tr -d '[:space:]')"
          [[ "$SLUG" =~ ^[a-z0-9-]+$ ]] || { echo "::error::slug غير صالح"; exit 1; }
          [[ "$REVISION" =~ ^[A-Za-z0-9._:-]{8,128}$ ]] || { echo "::error::revision غير صالح"; exit 1; }
          [[ "$SLUG" == "success-that-does-not-bring-joy-to-its-ownerarabic" ]] || { echo "::error::الاعتماد الأول مقفول على الحلقة التجريبية"; exit 1; }
          echo "RELEASED_SLUGS=$SLUG" >> "$GITHUB_ENV"
          echo "DIALOGUE_REVISION=$REVISION" >> "$GITHUB_ENV"
          echo "STAGING_PREFIX=staging/kuwaiti/$SLUG/$REVISION" >> "$GITHUB_ENV"

      - name: Write Firebase service account
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || { echo "::error::Firebase service account missing"; exit 1; }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > sa.json
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DRAHMAD_8E9E2 }}

      - name: Download exactly the approved Staging candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audio podcast-audits/kuwaiti
          AWS=(aws --endpoint-url "$CLOUDFLARE_R2_ENDPOINT" s3api)
          "${AWS[@]}" get-object --bucket "$CLOUDFLARE_R2_BUCKET" --key "$STAGING_PREFIX/$RELEASED_SLUGS.dialogue-kw.mp3" "audio/$RELEASED_SLUGS.dialogue-kw.mp3"
          "${AWS[@]}" get-object --bucket "$CLOUDFLARE_R2_BUCKET" --key "$STAGING_PREFIX/$RELEASED_SLUGS.dialogue-kw.json" "audio/$RELEASED_SLUGS.dialogue-kw.json"
          "${AWS[@]}" get-object --bucket "$CLOUDFLARE_R2_BUCKET" --key "$STAGING_PREFIX/$RELEASED_SLUGS.audit.json" "podcast-audits/kuwaiti/$RELEASED_SLUGS.json"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
          CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
          CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}

      - name: Prove the approved hashes before public promotion
        run: node scripts/prepare-kuwaiti-promotion.mjs --slug="$RELEASED_SLUGS" --revision="$DIALOGUE_REVISION"
        env:
          FIREBASE_SERVICE_ACCOUNT: sa.json

      - name: Mark public upload started
        run: node scripts/podcast-production-status.mjs --variant=kuwaiti --status=publishing --stage=uploading --slugs="$RELEASED_SLUGS" --note="يجري الآن نشر نفس ملف Staging الذي اعتمده المشرف؛ لا إعادة توليد."
        env:
          FIREBASE_SERVICE_ACCOUNT: sa.json

      - name: Publish approved Kuwaiti files to their independent public names
        run: npm run audio:r2:publish
        env:
          AUDIO_PUBLIC_BASE_URL: ${{ vars.AUDIO_PUBLIC_BASE_URL }}
          VITE_AUDIO_BASE_URL: ${{ vars.AUDIO_PUBLIC_BASE_URL }}
          CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
          CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}

      - name: Commit only public audio manifests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          PRESENT=()
          for f in src/data/audio-meta.json src/data/audio-peaks.json; do [ -f "$f" ] && PRESENT+=("$f"); done
          git add -- "${PRESENT[@]}"
          if git diff --cached --quiet; then
            echo "No manifest changes to commit."
          else
            git commit -m "chore: publish approved Kuwaiti Majlis pilot"
            pushed=0
            for attempt in 1 2 3; do
              if git pull --rebase --autostash origin main && git push origin HEAD:main; then pushed=1; break; fi
              sleep $((attempt * 5))
            done
            [ "$pushed" = 1 ] || { echo "::error::تعذر تثبيت manifest؛ سنرجع R2"; exit 1; }
          fi

      - name: Finalize R2 transaction
        run: npm run audio:r2:commit
        env:
          CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
          CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}

      - name: Mark published
        run: node scripts/podcast-production-status.mjs --variant=kuwaiti --status=published --stage=completed --slugs="$RELEASED_SLUGS" --uploaded=true --note="نُشرت النسخة الكويتية التي سمعها المشرف واعتمدها؛ الفصحى باقية مستقلة."
        env:
          FIREBASE_SERVICE_ACCOUNT: sa.json

      - name: Remove staging candidate after successful promotion
        if: success()
        run: aws --endpoint-url "$CLOUDFLARE_R2_ENDPOINT" s3 rm "s3://$CLOUDFLARE_R2_BUCKET/$STAGING_PREFIX" --recursive --no-progress
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
          CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
          CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}

      - name: Roll back public names on failure
        if: failure()
        continue-on-error: true
        run: npm run audio:r2:rollback
        env:
          CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
          CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}

      - name: Return candidate to review state on failure
        if: failure()
        continue-on-error: true
        run: node scripts/podcast-production-status.mjs --variant=kuwaiti --status=awaiting_approval --stage=awaiting_approval --slugs="$RELEASED_SLUGS" --error-code=KUWAITI_PROMOTION_FAILED --note="تعذر نشر المرشح؛ بقي في Staging ولم تتغير حلقة الفصحى."
        env:
          FIREBASE_SERVICE_ACCOUNT: sa.json
