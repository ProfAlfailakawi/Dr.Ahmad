name: Keep PROJECT-STATUS.md fresh

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'

permissions:
  contents: write

concurrency:
  group: project-status-sync
  cancel-in-progress: true

jobs:
  sync-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Force public npm registry
        run: npm config set registry https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Generate PROJECT-STATUS.md
        run: npm run project:status

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT-STATUS.md
          if git diff --cached --quiet; then
            echo "No changes to PROJECT-STATUS.md"
          else
            git commit -m "chore: keep PROJECT-STATUS.md fresh [skip ci]"
            # Use GitHub CLI to create a PR or push if we had token.
            # Using standard CI auto-commit flow.
            git push origin HEAD:main
          fi
