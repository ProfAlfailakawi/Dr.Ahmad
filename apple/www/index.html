<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>د. أحمد الفيلكاوي</title>
<style>
  :root { --bg: #FCFCFA; --fg: #1c1c1e; --muted: #6e6e73; --accent: #7A5C2E; }
  @media (prefers-color-scheme: dark) { :root { --bg: #151513; --fg: #f2f2f7; --muted: #aeaeb2; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: -apple-system-body; font-family: -apple-system, "SF Arabic", system-ui, sans-serif;
    display: grid; place-items: center; text-align: center;
    padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
  }
  main { max-width: 26rem; }
  /* ركن الودجت (iPhone Duo): الاستعلامات نفسها في src/index.css؛ المحتوى يحجز يمين الشاشة الفيزيائي. */
  @media screen and (orientation: portrait) and (min-width: 360px) and (max-width: 720px) and (min-aspect-ratio: 29/50),
  screen and (min-width: 721px) and (max-width: 1000px) and (min-height: 520px) and (max-height: 960px) and (orientation: landscape),
  screen and (min-width: 540px) and (max-width: 800px) and (min-height: 340px) and (max-height: 519px) and (orientation: landscape) and (max-aspect-ratio: 17/10),
  screen and (orientation: portrait) and (max-width: 720px) and (min-width: 381px) and (max-width: 383px),
       screen and (orientation: portrait) and (max-width: 720px) and (min-width: 469px) and (max-width: 471px),
  screen and (orientation: landscape) and (max-width: 1000px) and (min-height: 381px) and (max-height: 383px),
       screen and (orientation: landscape) and (max-width: 1000px) and (min-height: 469px) and (max-height: 471px) {
    body { padding-right: max(24px, env(safe-area-inset-right), 78px); padding-top: max(24px, env(safe-area-inset-top), clamp(64px, 30vh, 200px)); }
  }

  h1 { font: -apple-system-title2; font-weight: 700; margin: 0 0 .5rem; }
  p { color: var(--muted); line-height: 1.6; margin: 0 0 1.5rem; }
  .en { direction: ltr; font-size: .9em; }
  button {
    font: -apple-system-headline; border: 0; border-radius: 14px; padding: 14px 28px; min-height: 48px;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  button:active { opacity: .7; }
  @media (prefers-reduced-motion: no-preference) { button { transition: opacity .15s; } }
</style>
</head>
<body>
<main>
  <h1>د. أحمد الفيلكاوي</h1>
  <p>تعذّر الوصول إلى الخدمة الآن. تحقّق من اتصالك بالإنترنت ثم أعد المحاولة.<br>
     <span class="en">Can't reach Dr. Alfailakawi right now. Check your connection and try again.</span></p>
  <button id="retry" type="button">إعادة المحاولة · Retry</button>
</main>
<script>
  const target = "https://dr-alfailakawi.com";
  const go = () => { location.href = target; };
  document.getElementById("retry").addEventListener("click", go);
  window.addEventListener("online", go);
</script>
</body>
</html>
