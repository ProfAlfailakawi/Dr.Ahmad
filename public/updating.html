<!doctype html>
<!--
  صفحة «الموقع قيد التحديث» — صفحةٌ من عددٍ يُنضَّد.

  أثناء النشر قد تجيب واجهةُ Google الأمامية عن فتح صفحةٍ بصفحة خطأٍ إنجليزية
  (500/502/503/504) لم يكتبها الموقع. عاملُ الخدمة (public/sw.js) يحفظ هذه الصفحة
  عند تثبيته، ويقدّمها بدلاً من ذلك الجواب أو من انقطاعٍ والجهازُ متّصل — والرابطُ
  في شريط العنوان يبقى ما طلبه الزائر، فإعادةُ التحميل تفتحه هو نفسه.

  مستقلّةٌ تماماً: لا طلبَ خارجياً، والخطّان خطّا الموقع المحفوظان فيه وإلا خطُّ
  النظام. سياسةُ CSP تمنع السكربت المضمّن، فمنطقُها في /updating.js (يحفظه العامل
  معها). النهار هو الأصل كبقية الموقع، والليل باختيار الزائر وحده (theme-choice).
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FCFCFA">
<title>الموقع قيد التحديث · د. أحمد الفيلكاوي</title>
<script src="/updating.js"></script>
<style>
@font-face{font-family:"El Messiri";font-weight:400 700;font-display:swap;src:url("/fonts/elmessiri-K2F0fZBRmr9vQ1pHEey6MoiAAgDwbWu1jw.woff2") format("woff2")}
@font-face{font-family:"Tajawal";font-weight:400;font-display:swap;src:url("/fonts/tajawal-Iura6YBj_oCad4k1nzSBC5xLhLFw4Q.woff2") format("woff2")}
@font-face{font-family:"Tajawal";font-weight:500;font-display:swap;src:url("/fonts/tajawal-Iurf6YBj_oCad4k1l8KiHrRpiZtK6GwN9w.woff2") format("woff2")}
:root{
  --paper:#FCFCFA;--ink:#15161A;--muted:#5E6570;--rule:#15161A;--hair:rgba(21,22,26,.12);
  --slug:rgba(21,22,26,.075);--accent:#3E5C78;--ember:#8F5A28;--wash:#F4F5F3;
  --serif:"Noto Naskh Arabic","Amiri","Geeza Pro","Traditional Arabic","Times New Roman",serif;
  color-scheme:light;
}
html.dark{
  --paper:#0F1115;--ink:#ECEAE4;--muted:#B5B8BE;--rule:#ECEAE4;--hair:rgba(234,234,231,.14);
  --slug:rgba(234,234,231,.07);--accent:#84A9CA;--ember:#D6B78F;--wash:#171A1F;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"Tajawal",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Arabic",Tahoma,sans-serif;
  font-synthesis:none;-webkit-font-smoothing:antialiased;
  padding:max(28px,env(safe-area-inset-top)) 20px max(28px,env(safe-area-inset-bottom));
}
.sheet{max-width:600px;margin:0 auto;padding-top:clamp(0px,6vh,56px)}

/* الترويسة: العلامة واسم الموقع، ثم سطران مطبعيّان وسطر العدد */
.masthead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding-bottom:12px}
.mark{width:58px;height:35px;display:block;color:var(--ink)}
.name{font-family:"El Messiri",serif;font-size:15px;font-weight:600;letter-spacing:.01em;line-height:1.3;text-align:end}
.name small{display:block;font-family:"Tajawal",sans-serif;font-size:11.5px;font-weight:400;color:var(--muted);letter-spacing:0}
.rules{border-top:3px solid var(--rule);height:7px;border-bottom:1px solid var(--rule)}
.issue{display:flex;justify-content:space-between;gap:12px;padding:8px 0 9px;border-bottom:1px solid var(--hair);font-size:12px;color:var(--muted);line-height:1.5}
.issue b{font-weight:500;color:var(--ink)}

/* المادّة */
.kicker{margin:38px 0 0;font-size:12.5px;font-weight:500;color:var(--ember);display:flex;align-items:center;gap:10px}
.kicker::after{content:"";flex:0 0 36px;height:1px;background:currentColor;opacity:.6}
h1{margin:10px 0 0;font-family:"El Messiri",serif;font-weight:700;font-size:clamp(34px,9.4vw,52px);line-height:1.22;letter-spacing:-.005em}
.lead{margin:18px 0 0;max-width:30em;font-family:var(--serif);font-size:18px;line-height:1.85;color:var(--ink)}

/* خطّ المطبعة: شعرةٌ يمرّ عليها الحبر ببطء */
.press{position:relative;height:1px;margin:30px 0 0;background:var(--hair);overflow:hidden}
.press i{position:absolute;inset-block:0;inset-inline-start:0;width:28%;background:var(--ink);opacity:.7;animation:press 7s cubic-bezier(.45,0,.3,1) infinite alternate}

/* الأعمدة قيد التنضيد: سطورٌ رماديّة لم يُصبّ فيها الحرف بعد */
.galley{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:22px}
.galley span{display:block;height:7px;margin-bottom:11px;background:var(--slug);border-radius:1px}
.galley span:nth-child(3n){width:86%}
.galley span:nth-child(5n){width:62%}
.galley .col+.col{border-inline-start:1px solid var(--hair);padding-inline-start:22px}

.foot{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;margin-top:18px;padding-top:16px;border-top:1px solid var(--hair)}
button{
  min-height:44px;padding:0 20px;border-radius:2px;cursor:pointer;
  border:1px solid var(--ink);background:var(--paper);color:var(--ink);
  font:inherit;font-size:14px;font-weight:500;
  transition:background-color .2s ease,color .2s ease;
}
button:hover{background:var(--ink);color:var(--paper)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.note{flex:1 1 200px;margin:0;min-height:20px;font-size:13px;line-height:1.7;color:var(--muted)}
@keyframes press{from{transform:translateX(0)}to{transform:translateX(-257%)}}
@media (max-width:420px){.galley{gap:16px}.galley .col+.col{padding-inline-start:16px}}
@media (prefers-reduced-motion:reduce){.press i{animation:none;opacity:.35}}
</style>
</head>
<body>

><rect x="0" y="9" width="1" height="1"/><rect x="2" y="9" width="1" height="1"/><rect x="4" y="9" width="1" height="1"/><rect x="6" y="9" width="1" height="1"/><rect x="14" y="9" width="1" height="1"/><rect x="16" y="9" width="1" height="1"/><rect x="22" y="9" width="1" height="1"/><rect x="24" y="9" width="1" height="1"/><rect x="0" y="10" width="3" height="1"/><rect x="4" y="10" width="1" height="1"/><rect x="6" y="10" width="7" height="1"/><rect x="14" y="10" width="1" height="1"/><rect x="16" y="10" width="1" height="1"/><rect x="18" y="10" width="3" height="1"/><rect x="22" y="10" width="1" height="1"/><rect x="24" y="10" width="1" height="1"/><rect x="2" y="11" width="1" height="1"/><rect x="4" y="11" width="1" height="1"/><rect x="12" y="11" width="1" height="1"/><rect x="14" y="11" width="1" height="1"/><rect x="16" y="11" width="1" height="1"/><rect x="18" y="11" width="1" height="1"/><rect x="20" y="11" width="1" height="1"/><rect x="22" y="11" width="1" height="1"/><rect x="24" y="11" width="1" height="1"/><rect x="0" y="12" width="3" height="1"/><rect x="4" y="12" width="19" height="1"/><rect x="24" y="12" width="1" height="1"/><rect x="24" y="13" width="1" height="1"/><rect x="0" y="14" width="14" height="1"/><rect x="15" y="14" width="1" height="1"/><rect x="17" y="14" width="1" height="1"/><rect x="19" y="14" width="6" height="1"/></g></svg>
    <p class="name">د. أحمد الفيلكاوي<small>مقالات · كتب · حلقات</small></p>
  </header>
  <div class="rules" aria-hidden="true"></div>
  <p class="issue"><span><b>العدد قيد التنضيد</b></span><span id="issue-date">اليوم</span></p>

  <p class="kicker">تحت الطبع</p>
  <h1 id="title">نُجدّد الموقع، ونعود بعد قليل</h1>
  <p class="lead" id="lead">يُجدَّد الموقع في هذه الدقائق؛ عُد بعد قليل تجد ما كنت تقرؤه في موضعه.</p>

  <div class="press" aria-hidden="true"><i></i></div>
  <div class="galley" aria-hidden="true">
    <div class="col"><span></span><span></span><span></span><span></span><span></span></div>
    <div class="col"><span></span><span></span><span></span><span></span><span></span></div>
  </div>

  <div class="foot">
    <button type="button" id="retry">افتح الصفحة الآن</button>
    <p class="note" id="note" role="status" aria-live="polite">ستعود هذه الصفحة وحدها حين يكتمل التجديد.</p>
  </div>
</main>
</body>
</html>
