name: بيك أوف الأصوات الكويتية

on:
  workflow_dispatch:
    inputs:
      male_bakeoff:
        description: 'اقلب الاتجاه: جرّب رجالاً أعمق من Puck (Zephyr ثابتة) — علاج انهيار الفجوة في المداخلات القصيرة'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: podcast-voice-bakeoff-kw
  cancel-in-progress: false

jobs:
  bakeoff:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: |
          npm ci --registry=https://registry.npmjs.org/ --prefer-online
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run the bakeoff
        run: node scripts/podcast-voice-bakeoff-kw.mjs ${{ inputs.male_bakeoff && '--male-bakeoff' || '' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_MODEL: gemini-2.5-pro-preview-tts

      - name: Upload to isolated R2 staging
        run: |
          set -euo pipefail
          PREFIX="staging/voice-bakeoff"
          AWS=(aws --endpoint-url "$CLOUDFLARE_R2_ENDPOINT" s3api)
          "${AWS[@]}" put-object --bucket "$CLOUDFLARE_R2_BUCKET" \
            --key "$PREFIX/voice-bakeoff.mp3" --body "audio/voice-bakeoff.mp3" \
            --content-type audio/mpeg --cache-control no-store
          for f in audio/voice-bakeoff/*.mp3; do
            "${AWS[@]}" put-object --bucket "$CLOUDFLARE_R2_BUCKET" \
              --key "$PREFIX/$(basename "$f")" --body "$f" \
              --content-type audio/mpeg --cache-control no-store
          done
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
          CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
          CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}

      - name: Publish a readable summary
        if: always()
        run: |
          {
            echo "## بيك أوف الأصوات الكويتية"
            if [ -f audio/voice-bakeoff.mp3 ]; then
              echo '```'
              echo "$AUDIO_PUBLIC_BASE_URL/staging/voice-bakeoff/voice-bakeoff.mp3"
              echo '```'
              echo ""
              echo "| الزوج | الرجل | المرأة | الفجوة |"
              echo "|---|---|---|---|"
              node -e "
                const l=require('./audio/voice-bakeoff-legend.json');
                for (const p of l.pairs) {
                  const g = p.failed ? 'سقط: '+p.failed : (typeof p.gap==='number' ? Math.round(p.gap)+' هرتز' : 'لم تُقَس');
                  console.log('| '+p.label+' | '+p.male+' | '+p.female+' | '+g+' |');
                }
              "
            else
              echo "**لم يُولَّد صوت** — العطب قبل التوليد."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          AUDIO_PUBLIC_BASE_URL: ${{ vars.AUDIO_PUBLIC_BASE_URL }}

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-bakeoff-kw
          if-no-files-found: warn
          retention-days: 7
          path: |
            audio/voice-bakeoff.mp3
            audio/voice-bakeoff/
            audio/voice-bakeoff-legend.json
