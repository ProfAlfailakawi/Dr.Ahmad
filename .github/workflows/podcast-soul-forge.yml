name: مصنع الروح — توليد الحلقات الحوارية

on:
  workflow_dispatch:
    inputs:
      slugs:
        description: 'أسماء الحلقات مفصولة بمسافة (اتركه فارغاً لتوليد دفعة تلقائية)'
        required: false
        default: ''
      batch:
        description: 'رقم الدفعة: ١ ثم ٢ ثم ٣ ثم ٤ — أربع دفعات تُنهي الأرشيف كله'
        required: false
        default: '1'
      limit:
        description: 'عدد الحلقات في الدفعة (٤٠ تسع في الحدّ الزمني)'
        required: false
        default: '40'

permissions:
  contents: read

concurrency:
  group: podcast-soul-forge
  cancel-in-progress: false

jobs:
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !/.codex-backups/
            !/*.txt
            !/agent-*.sqlite
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: التحقق من المفتاح
        run: |
          if [ -z "$AZURE_SPEECH_KEY" ]; then
            echo "::error::مفتاح Azure مفقود — أضِف AZURE_SPEECH_KEY في أسرار المستودع"
            exit 1
          fi
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}

      - name: توليد الحلقات
        # كل حلقة ~٣ دقائق (حدّ الباقة المجانية عشرون طلباً في الدقيقة)،
        # فدفعة ٤٠ تستغرق ~ساعتين وتسع داخل مهلة الوِرشة.
        run: |
          if [ -n "${{ github.event.inputs.slugs }}" ]; then
            node scripts/podcast-soul-forge.mjs ${{ github.event.inputs.slugs }}
          else
            node scripts/podcast-soul-forge.mjs --all --limit ${{ github.event.inputs.limit }} --batch ${{ github.event.inputs.batch }} --skip-done
          fi
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}

      - name: رفع الحلقات المولَّدة
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: soul-episodes
          path: |
            public/audio/*.dialogue.mp3
            .soul-forge-work/last-run.json
          if-no-files-found: warn
          retention-days: 14
