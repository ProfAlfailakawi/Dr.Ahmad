name: إنذار التوقف — الموقع حي؟

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: uptime-alarm
  cancel-in-progress: true

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: فحص نبض الموقع وصفحاته الحيوية
        shell: bash
        run: |
          set -u
          FAILED=""
          check () {
            local url="$1" label="$2" needle="$3"
            local code
            # محاولتان قبل إعلان السقوط — عثرة شبكة عابرة لا تستحق إنذاراً
            for attempt in 1 2; do
              code=$(curl -sL -o /tmp/page.html -w "%{http_code}" --max-time 25 "$url" || echo "000")
              if [ "$code" = "200" ] && grep -q "$needle" /tmp/page.html; then
                echo "OK  $label ($code)"
                return 0
              fi
              sleep 8
            done
            echo "DOWN  $label (HTTP $code)"
            FAILED="$FAILED | $label"
            return 0
          }
          check "https://dr-alfailakawi.com/"            "الرئيسية"     "الفيلكاوي"
          check "https://dr-alfailakawi.com/articles"    "المقالات"     "مقال"
          check "https://dr-alfailakawi.com/research"    "الأبحاث"      "بحث"
          check "https://dr-alfailakawi.com/sitemap.xml" "خريطة الموقع" "urlset"
          if [ -n "$FAILED" ]; then
            echo "::error::الموقع يحتاج نظرتك — ساقط:${FAILED}. افتح dr-alfailakawi.com للتأكد."
            exit 1
          fi
          echo "الموقع كله ينبض بسلام."
