name: Pilot الصوت البشري المعزول

on:
  workflow_dispatch:
    inputs:
      pilot_limit:
        description: عدد المقالات التجريبية (الافتراضي واحد)
        required: false
        default: '1'
      pilot_slug:
        description: رابط المقال الداخلي المراد اختباره
        required: false
        default: 'how-do-we-assess-without-breaking-the-human-beingarabic'

permissions:
  contents: read

concurrency:
  group: human-audio-pilot
  cancel-in-progress: false

jobs:
  render-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify FFmpeg runtime
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Verify engines before spending quota
        run: npm run audio:quality:self-test

      - name: Render isolated Fahed, Noura and dialogue Pilot
        run: node scripts/human-audio-pilot.mjs --execute --with-dialogue --pilot-limit=${{ inputs.pilot_limit || '1' }} --pilot-slug=${{ inputs.pilot_slug || 'how-do-we-assess-without-breaking-the-human-beingarabic' }}
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          PODCAST_RELEASE_MIN_SCORE: '94'
          HUMAN_AUDIO_MIN_SCORE: '95'

      - name: Package review files only
        if: always()
        run: |
          mkdir -p pilot-review
          find audio -maxdepth 1 -type f \( -name '*.mp3' -o -name '*.json' \) -exec cp {} pilot-review/ \; 2>/dev/null || true
          find audio-audits podcast-audits -type f -name '*.json' -exec cp {} pilot-review/ \; 2>/dev/null || true

      - name: Upload private Pilot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: human-audio-pilot-${{ github.run_number }}
          path: pilot-review/
          if-no-files-found: error
          retention-days: 7
