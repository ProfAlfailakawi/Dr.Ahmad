name: درع النسخ الاحتياطي — نسخ وبروفة استرجاع

on:
  schedule:
    # السبت 03:00 UTC = 06:00 صباح الكويت
    - cron: '0 3 * * 6'
  workflow_dispatch:

concurrency:
  group: backup-firestore
  cancel-in-progress: true

jobs:
  backup-and-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: تحضير حساب الخدمة
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DRAHMAD_8E9E2 }}' > sa.json
      - name: النسخ الكامل + بروفة الاسترجاع المبرهنة
        run: node scripts/backup-firestore.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: sa.json
          FIREBASE_PROJECT_ID: drahmad-8e9e2
      - name: إيداع النسخة في R2 (مؤرخة + الأحدث)
        run: |
          FILE=$(ls build/firestore-backup-*.json.gz | head -1)
          BUCKET="${{ vars.CLOUDFLARE_R2_BUCKET }}"
          aws s3 cp "$FILE" "s3://$BUCKET/backups/$(basename $FILE)" \
            --endpoint-url "${{ secrets.CLOUDFLARE_R2_ENDPOINT }}" --no-progress
          aws s3 cp "$FILE" "s3://$BUCKET/backups/firestore-latest.json.gz" \
            --endpoint-url "${{ secrets.CLOUDFLARE_R2_ENDPOINT }}" --no-progress
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
