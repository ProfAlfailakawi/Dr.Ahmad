name: نظافة المستودع — إزالة النفاية تلقائياً

# رفعةٌ محلية («update database backup files») تُعيد أحياناً مجلّد العمل كاملاً:
# .codex-backups + agent.sqlite (تسريب خاص) + أسماء مشوّهة طويلة تكسر checkout
# فيتجمّد النشر وتنهار الخلاصة. هذا الحارس يمسح النفاية من كل دفعةٍ فور وصولها
# عبر git Data API فقط (بلا actions/checkout الذي يفشل على الأسماء المشوّهة).

on:
  push:
    branches: [main]

concurrency:
  group: repo-hygiene
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # دفعات GITHUB_TOKEN لا تُطلق on:push، فلا حلقة لا نهائية من الحارس على نفسه.
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: امسح النفاية عبر الـAPI (بلا checkout)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          const REPO = process.env.REPO, TOKEN = process.env.GH_TOKEN
          const H = { Authorization:`Bearer ${TOKEN}`, Accept:'application/vnd.github+json', 'User-Agent':'hygiene', 'Content-Type':'application/json' }
          const api = 'https://api.github.com'
          const call = async (p,m='GET',b=null,tries=4)=>{
            for(let i=0;i<tries;i++){
              const r=await fetch(`${api}/repos/${REPO}/${p}`,{method:m,headers:H,body:b?JSON.stringify(b):undefined})
              if(r.ok) return r.json()
              const t=await r.text()
              if(r.status>=500&&i<tries-1){ await new Promise(x=>setTimeout(x,2500*(i+1))); continue }
              throw new Error(`${m} ${p} -> ${r.status} ${t.slice(0,140)}`)
            }
          }
          // معيار النفاية: قواعد خاصة، نسخ احتياطية، أسماء مشوّهة (mojibake) أو طويلة تكسر checkout.
          const junkName = (name, isTree) => {
            if (isTree) return name === '.codex-backups'
            return name.endsWith('.sqlite')
              || /^(audio-meta-|bodies-vocalized-|podcast-state-|PROMPT-|agent-)/.test(name)
              || /#U00|Ã.\^|Ì\^|Â\^|Ù\^|Ø.Ù/.test(name)
              || Buffer.byteLength(name,'utf8') > 100
          }
          async function cleanTree(sha){
            const tree = await call(`git/trees/${sha}`)
            let changed = false
            const out = []
            for (const e of tree.tree){
              const name = e.path
              if (junkName(name, e.type==='tree')){ changed = true; continue }
              if (e.type==='tree'){
                const sub = await cleanTree(e.sha)
                if (sub.changed) changed = true
                out.push({ path:name, mode:e.mode, type:'tree', sha: sub.changed ? sub.sha : e.sha })
              } else {
                out.push({ path:name, mode:e.mode, type:e.type, sha:e.sha })
              }
            }
            if (!changed) return { sha, changed:false }
            const nt = await call('git/trees','POST',{ tree: out })
            return { sha: nt.sha, changed:true }
          }
          const ref = await call('git/ref/heads/main')
          const baseSha = ref.object.sha
          const baseCommit = await call(`git/commits/${baseSha}`)
          // فحصٌ سريع: هل توجد نفايةٌ أصلاً؟
          const full = await call(`git/trees/${baseCommit.tree.sha}?recursive=1`)
          const dirty = full.tree.some(e => junkName(e.path.split('/').pop(), e.type==='tree'))
          if (!dirty){ console.log('✓ المستودع نظيف — لا شيء يُمسح.'); process.exit(0) }
          const cleaned = await cleanTree(baseCommit.tree.sha)
          const commit = await call('git/commits','POST',{
            message: 'chore(hygiene): إزالة ملفات نفاية آلياً (agent.sqlite/نسخ احتياطية/أسماء مشوّهة) تحمي النشر والخصوصية',
            tree: cleaned.sha, parents: [baseSha]
          })
          await call('git/refs/heads/main','PATCH',{ sha: commit.sha, force:false })
          console.log('🧹 نُظّف المستودع →', commit.sha)
          NODE
