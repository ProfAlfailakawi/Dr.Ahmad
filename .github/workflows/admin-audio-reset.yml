name: تصفير الصوت الشامل

# هدمٌ لا بناء: يمحو كل ما وُلِّد من قراءاتٍ وحوارات ليُعاد من نصوصٍ مُشكَّلة.
# لا يعمل بجدولٍ ولا بدفعٍ ولا باستدعاءٍ من تشغيلةٍ أخرى — بيد الدكتور وحده،
# وبكلمة تأكيدٍ يكتبها حرفاً بحرف. فما كان أثره لا يُردّ وجب أن يكون بابه ضيّقاً.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'اكتب بالضبط: امسح-كل-الصوت'
        required: true
      keep:
        description: 'روابط مختصرة تُستبقى، مفصولة بفاصلة (مثال: qabas-201909-001)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: admin-audio-reset
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !/.codex-backups/
            !/*.txt
            !/agent-*.sqlite
            !/audio-meta-*.json
            !/bodies-vocalized-*.json
            !/podcast-state-*.json
            !/whatsapp-agent/*.command
          sparse-checkout-cone-mode: false
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # ffmpeg ليس ترفاً هنا: خطوة البناء تُشغّل اختبارات محرك الصوت وهي تشترط
      # وجوده، فبدونه يسقط البناء بعد أن يكون الحذف قد تمّ — فتبقى المانيفستات
      # زاعمةً وجود ملفاتٍ مُزالة. وهذا ما وقع فعلاً في التشغيلة الأولى.
      - name: تثبيت ffmpeg وawscli
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --user awscli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # الخطة تُطبع قبل أي إتلاف، فيبقى في السجل دليلٌ على ما جرى ولماذا
      - name: عرض الخطة قبل التنفيذ
        run: node scripts/reset-all-audio.mjs --keep="${{ inputs.keep }}"

      # خانةُ استبقاءٍ فارغة تعني «امسح كل شيء» — وهي نيّةٌ مشروعة، لكنها أيضاً
      # صورةُ الخطأ الأشيع: يُملأ التأكيد ويُنسى الاستبقاء، فيضيع ما أراد صاحبه
      # إبقاءه. فمن أرادها فارغةً حقاً فليقلها صراحةً.
      - name: التثبت من نيّة المسح الكامل
        if: inputs.keep == ''
        run: |
          if [ "${{ inputs.confirm }}" != "امسح-كل-الصوت-بلا-استثناء" ]; then
            echo '::error::خانة «الاستبقاء» فارغة. إن أردت مسح كل شيء بلا استثناء فاكتب في التأكيد: امسح-كل-الصوت-بلا-استثناء'
            exit 1
          fi

      # البوّابتان كانتا متناقضتين فاستحال المسحُ الكامل: الغلاف يشترط عند
      # خانةِ استبقاءٍ فارغة كلمةَ «امسح-كل-الصوت-بلا-استثناء»، والسكربت لا
      # يقبل إلا «امسح-كل-الصوت» — فأيُّهما أُرضي أغضب الآخر. تبقى البوّابةُ
      # الإنسانية الأشدّ أعلاه كما هي، ويُمرَّر للسكربت ما يفهمه هو.
      - name: تصفير المانيفستات وتجهيز قائمة R2
        run: |
          node scripts/reset-all-audio.mjs \
            --keep="${{ inputs.keep }}" \
            --execute \
            --confirm="امسح-كل-الصوت"

      - name: حذف الملفات من R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
          R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
        run: |
          set -euo pipefail
          test -n "$R2_BUCKET" && test -n "$R2_ENDPOINT"

          # الأداة أولاً: بلا هذا الفحص يغيب أمر aws فيبتلع `|| true` كل نداء،
          # فتُعلن التشغيلة «حُذف 320 ملفاً» ولم يُحذف واحد. ونجاحٌ كاذب أخطر من
          # فشلٍ صريح: يمضي الدكتور على أن الأمر تمّ، والحقيقة خلافه.
          command -v aws >/dev/null || { echo '::error::awscli غير مثبَّت — أُوقف قبل أن أدّعي حذفاً لم يقع.'; exit 1; }

          ok=0; failed=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            # `--no-progress` خيارُ `aws s3 cp/sync` لا `rm`؛ فكان يردّ
            # «Unknown options» على كل ملف: حُذف ٠ · تعذّر ٢٧.
            if aws s3 rm "s3://$R2_BUCKET/$file" --endpoint-url "$R2_ENDPOINT" --only-show-errors; then
              ok=$((ok + 1))
            else
              failed=$((failed + 1))
              echo "::warning::تعذّر حذف $file"
            fi
          done < audio-reset-targets.txt

          echo "حُذف فعلاً: $ok · تعذّر: $failed"
          # لا نمضي على حذفٍ منقوص: المانيفست سيُصفَّر، فلو بقيت ملفاتٌ في R2
          # بلا سجلٍّ صارت يتيمةً لا يعرفها أحد ولا تُنظَّف أبداً.
          [ "$failed" -eq 0 ] || { echo "::error::فشل حذف $failed ملفاً."; exit 1; }

      # سجلّ الاعتماد يُصفَّر هو الآخر، وإلا بقيت فيه بصماتُ حلقاتٍ لم تعد
      # موجودة فيمنع إعادة توليدها بحجّة أنها «معتمدة سلفاً».
      - name: تصفير سجلّ الاعتماد للمحذوفين
        run: |
          node -e "
            const fs = require('fs');
            const path = '.podcast-state.json';
            if (!fs.existsSync(path)) { console.log('لا سجلّ — لا شيء يُصفَّر.'); process.exit(0) }
            const keep = new Set('${{ inputs.keep }}'.split(',').map(s => s.trim()).filter(Boolean));
            const state = JSON.parse(fs.readFileSync(path, 'utf8'));
            const done = state.done || {};
            let dropped = 0;
            for (const key of Object.keys(done)) {
              if (!keep.has(String(key).split(':')[0])) { delete done[key]; dropped++ }
            }
            fs.writeFileSync(path, JSON.stringify({ ...state, done }, null, 2) + '\n');
            console.log('أُسقط من السجل: ' + dropped + ' مدخلاً');
          "

      - name: بناء الموقع بعد التصفير
        run: npm run build
        env:
          VITE_SITE_URL: https://dr-alfailakawi.com

      # الرفع يجري ولو تعثّر البناء. فالحذف من R2 قد تمّ قبله ولا يُردّ، فإن
      # حجبنا المانيفست الجديد بقي القديم يزعم وجود ملفاتٍ مُزالة — ويرى الزائر
      # مشغّلاً لصوتٍ لا وجود له. والاتّساق مع الواقع أوجب من انتظار بناءٍ نظيف.
      - name: رفع النتيجة
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          rm -f audio-reset-targets.txt
          git add src/data/audio.json src/data/audio-meta.json src/data/podcast-admin.json src/data/site-articles-feed.json
          git add -f .podcast-state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'لا تغيير يُرفع.'
          else
            git commit -m "chore(audio): تصفير شامل بأمر الدكتور (استُبقي: ${{ inputs.keep }})"
            # الحلقة القديمة كانت تنتهي بـ`sleep` فتُرجع صفراً ولو فشلت المحاولات
            # الثلاث — فيُعلن نجاحٌ كاذب. الآن يُرصد النجاح صراحةً.
            pushed=0
            for attempt in 1 2 3; do
              if git pull --rebase --autostash origin main && git push origin HEAD:main; then pushed=1; break; fi
              sleep $((attempt * 5))
            done
            if [ "$pushed" != 1 ]; then echo "::error::تعذّر تثبيت التصفير بعد ثلاث محاولات."; exit 1; fi
          fi
