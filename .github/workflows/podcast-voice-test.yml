name: تجربة أصوات — مقارنة لهجة كويتية

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: podcast-voice-test
  cancel-in-progress: false

jobs:
  voice-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: |
          npm ci --registry=https://registry.npmjs.org/ --prefer-online
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate voice comparison
        run: node scripts/podcast-voice-test.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_MODEL: gemini-3.1-flash-tts-preview

      - name: Upload comparison audio
        uses: actions/upload-artifact@v4
        with:
          name: kuwaiti-voice-test
          if-no-files-found: error
          retention-days: 7
          path: |
            audio/voice-test.mp3
            audio/voice-test-legend.json
