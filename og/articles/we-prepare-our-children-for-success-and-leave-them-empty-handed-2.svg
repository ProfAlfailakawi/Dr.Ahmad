<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" dir="rtl">
  <defs>
    <style>
      .bg{fill:#FCFCFA}.ink{fill:#15161A}.soft{fill:#626A76}.accent{fill:#3E5C78}.hair{stroke:#3E5C78;stroke-opacity:.18}
      text{font-family:"Tajawal","Arial",sans-serif}.display{font-family:"El Messiri","Tajawal",serif}
    </style>
  </defs>
  <rect class="bg" width="1200" height="630"/>
  <circle cx="210" cy="118" r="280" fill="#3E5C78" opacity=".07"/>
  <rect x="64" y="64" width="1072" height="502" rx="0" fill="none" class="hair" stroke-width="2"/>
  <text x="1080" y="134" text-anchor="end" class="accent" font-size="30" font-weight="700">التربية · ١٦ مايو ٢٠٢٥</text>
  <text x="1080" y="226" text-anchor="end" class="display ink" font-size="58" font-weight="700">نعجن أبناءنا للنجاح… ونُخرجهم</text>
  <text x="1080" y="300" text-anchor="end" class="display ink" font-size="58" font-weight="700">فارغين</text>
  <text x="1080" y="466" text-anchor="end" class="soft" font-size="29" font-weight="400">عقولٌ مُخمّرة بالضغط… وأرواحٌ بلا نكهة في مدارسنا. يُعامَل</text>
  <text x="1080" y="508" text-anchor="end" class="soft" font-size="29" font-weight="400">الطفل كما تُعامَل العجينة.</text>
  <rect x="898" y="526" width="182" height="4" class="accent"/>
  <text x="1080" y="564" text-anchor="end" class="ink" font-size="26" font-weight="700">د. أحمد الفيلكاوي</text>
  <text x="1080" y="596" text-anchor="end" class="soft" font-size="21">dr-alfailakawi.com</text>
</svg>