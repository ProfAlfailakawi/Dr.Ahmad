name: حارس الموقع — إزالة تلوّث اللعبة تلقائياً

# هذا مستودع «موقع د. أحمد الأكاديمي» فقط. إن دفعت أي جهة (AI Studio) مشروع
# اللعبة (MotionGame/galaxy) بالخطأ، يتراجع هذا الحارس عن الدفعة تلقائياً خلال ثوانٍ.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  guard:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: كشف تلوّث اللعبة والتراجع عنه
        run: |
          if grep -qE 'MotionGame|galaxyEngine|galaxyAudio' src/App.tsx 2>/dev/null; then
            echo "⚠ تلوّث لعبة مكتشف في src/App.tsx — أتراجع عن الدفعة"
            git config user.name "site-guard"
            git config user.email "guard@users.noreply.github.com"
            # التراجع عن دفعة اللعبة يعيد الموقع النظيف؛ وإن تعذّر، أُعيد لآخر حالة نظيفة
            git revert --no-edit HEAD || git reset --hard HEAD~1
            git push origin main
            echo "✅ استُعيد الموقع النظيف"
          else
            echo "✓ لا تلوّث — الموقع سليم"
          fi
