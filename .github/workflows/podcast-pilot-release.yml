name: إطلاق البودكاست الحواري المعتمد

on:
  workflow_dispatch:
    inputs:
      slugs:
        description: 'Slug واحد أو أكثر مفصولة بفواصل'
        required: false
        default: 'how-do-we-assess-without-breaking-the-human-beingarabic'
      no_gemini:
        description: 'توليد بلا Gemini إطلاقاً (يتطلب حواراً يدوياً؛ STT مشدد بدل الحكم)'
        type: boolean
        default: false
  # التوليد الليلي: يقرأ ما أرسله الدكتور من غرفة الإنتاج (زر «أرسل للتوليد الليلي»)
  schedule:
    - cron: '30 2 * * *'

permissions:
  contents: write

concurrency:
  group: podcast-pilot-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies and media tools
        run: |
          npm config set registry https://registry.npmjs.org/
          # اللوكفايل قد يعود ملوثاً بروابط مستودع داخلي من بيئة أدوات الذكاء —
          # التطبيع يجعل npm ci يسحب من السجل العام دائماً (كما في workflow النشر).
          node scripts/normalize-npm-registry.mjs
          npm ci --registry=https://registry.npmjs.org/ --prefer-online --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000 --fetch-timeout=120000
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --user awscli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Write Firebase service account
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || { echo "::error::Firebase service account missing"; exit 1; }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > sa.json
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DRAHMAD_8E9E2 }}

      - name: Verify secrets
        run: |
          test -n "$AZURE_SPEECH_KEY" || { echo "::error::AZURE_SPEECH_KEY missing"; exit 1; }
          if [ -z "$GEMINI_API_KEY" ] && [ -z "$GOOGLE_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY or GOOGLE_API_KEY missing"
            exit 1
          fi
          test -n "$CLOUDFLARE_R2_ENDPOINT" || { echo "::error::R2 endpoint missing"; exit 1; }
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}

      - name: Run engine and release-gate self tests
        run: |
          npm run podcast:ar:self-test
          npm run podcast:release:self-test

      - name: Generate requested full Arabic episodes
        shell: bash
        run: |
          REQUESTED="${{ inputs.slugs }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            REQUESTED="$(node scripts/podcast-queue-next.mjs || true)"
            if [ -z "$REQUESTED" ]; then
              echo "قائمة التوليد الليلي فارغة — لا شيء الليلة."
              exit 0
            fi
            echo "قائمة الليلة: $REQUESTED"
          fi
          IFS=',' read -ra ITEMS <<< "$REQUESTED"
          if [ "${#ITEMS[@]}" -lt 1 ] || [ "${#ITEMS[@]}" -gt 3 ]; then
            echo "::error::Provide between one and three slugs"
            exit 1
          fi
          # جسر اللوحة: حوار الدكتور المرفوع من غرفة الإنتاج (Word → Firestore) يُسحب
          # ملفات manual-dialogues/ قبل التوليد — وملفات المستودع الموجودة تبقى المعتمدة.
          node scripts/fetch-manual-dialogues.mjs --slugs="$REQUESTED" || true
          EXTRA_FLAGS=""
          if [ "${{ inputs.no_gemini }}" = "true" ]; then
            EXTRA_FLAGS="--no-gemini"
            echo "⚙ وضع بلا Gemini مفعّل — حوار يدوي + STT مشدد"
          fi
          for slug in "${ITEMS[@]}"; do
            slug="$(echo "$slug" | xargs)"
            echo "Generating $slug"
            node scripts/podcast-dialogue.mjs --slug="$slug" --lang=ar --force --reuse-dialogue $EXTRA_FLAGS
          done
          echo "RELEASED_SLUGS=$REQUESTED" >> "$GITHUB_ENV"
        env:
          FIREBASE_SERVICE_ACCOUNT: sa.json
          FIREBASE_PROJECT_ID: drahmad-8e9e2
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          PODCAST_RELEASE_MIN_SCORE: '94'
          # كاش الاستئناف عبر R2 staging: الحوار المجتاز والمقاطع المجتازة تنجو من موت الرانر،
          # فلا يُعاد إلا المقطع الفاشل — صفر هدر Gemini/Azure على ما نجح سابقاً.
          CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
          CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}

      - name: Validate requested local episodes
        run: node scripts/podcast-release-gate.mjs --local --slugs="${RELEASED_SLUGS:-${{ inputs.slugs }}}"
        env:
          PODCAST_RELEASE_MIN_SCORE: '94'

      - name: Publish accepted files to R2 atomically
        run: npm run audio:r2:publish
        env:
          AUDIO_PUBLIC_BASE_URL: ${{ vars.AUDIO_PUBLIC_BASE_URL }}
          VITE_AUDIO_BASE_URL: ${{ vars.AUDIO_PUBLIC_BASE_URL }}
          CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
          CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}

      - name: Build and validate final RSS
        run: |
          npm run audio:external:verify
          npm run build
          npm run podcast:release:dist
        env:
          VITE_SITE_URL: https://dr-alfailakawi.com
          AUDIO_PUBLIC_BASE_URL: ${{ vars.AUDIO_PUBLIC_BASE_URL }}
          VITE_AUDIO_BASE_URL: ${{ vars.AUDIO_PUBLIC_BASE_URL }}
          PODCAST_RELEASE_MIN_SCORE: '94'

      - name: Commit release manifests
        run: |
          rm -f sa.json
          npm run audio:guard
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .podcast-state.json src/data/audio.json src/data/audio-meta.json src/data/podcast-admin.json
          if git diff --cached --quiet; then
            echo "No manifest changes to commit."
          else
            git commit -m "chore: publish validated podcast dialogue episodes"
            git push origin HEAD:main
          fi


      - name: Finalize R2 transaction
        run: npm run audio:r2:commit
        env:
          CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
          CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}

      - name: Roll back R2 transaction on any failure
        if: failure()
        run: npm run audio:r2:rollback
        env:
          CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
          CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: podcast-pilot-release-evidence
          path: |
            podcast-audits
            .podcast-state.json
            src/data/audio-meta.json
            dist/podcast.xml
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
