name: مزامنة ماذا قالوا

on:
  schedule:
    # تحديث الشهادات المعتمدة من الرسائل الحقيقية؛ العرض نفسه يدور كل 3 أيام داخل الموقع.
    - cron: '37 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/auto-testimonials.mjs
      - .github/workflows/auto-testimonials.yml
      - firestore.rules

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run testimonials:auto:self-test
      - name: Write Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT_DRAHMAD_8E9E2: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DRAHMAD_8E9E2 }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_DRAHMAD_8E9E2" ]; then
            echo "::error::Missing GitHub secret: FIREBASE_SERVICE_ACCOUNT_DRAHMAD_8E9E2"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_DRAHMAD_8E9E2" > firebase-service-account.json
      - name: Sync approved testimonials
        env:
          FIREBASE_PROJECT_ID: drahmad-8e9e2
          FIREBASE_SERVICE_ACCOUNT: firebase-service-account.json
        run: npm run testimonials:auto
