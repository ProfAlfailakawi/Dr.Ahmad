name: مجلس الفكرة — تجربة كويتية Gemini

on:
  workflow_dispatch:
    inputs:
      slugs:
        description: 'slug الحلقة الكويتية التجريبية'
        required: true
      revision_id:
        description: 'بصمة مراجعة الحوار المقفول من لوحة التحكم'
        required: true
      regenerate:
        description: 'استبدال مرشّحٍ ينتظر الاعتماد (يلزم فقط بعد تشغيلةٍ ناجحة)'
        required: false
        type: boolean
        default: false
      takes:
        description: 'بيك أوف الحلقة: عدد النسخ الكاملة (1-3) — العينة تتذبذب بين التشغيلات، فبدل محاربة التذبذب نحصده: يولّد نسخاً ويختار الدكتور أفضلها بأذنه'
        required: false
        default: '1'

permissions:
  contents: read

concurrency:
  group: podcast-kuwaiti-pilot-${{ inputs.slugs }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: |
          npm ci --registry=https://registry.npmjs.org/ --prefer-online
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --user awscli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Resolve locked pilot identity
        shell: bash
        run: |
          set -euo pipefail
          SLUG="$(echo '${{ inputs.slugs }}' | tr -d '[:space:]')"
          REVISION="$(echo '${{ inputs.revision_id }}' | tr -d '[:space:]')"
          [[ "$SLUG" =~ ^[a-z0-9-]+$ ]] || { echo "::error::slug غير صالح"; exit 1; }
          [[ "$REVISION" =~ ^[A-Za-z0-9._:-]{8,128}$ ]] || { echo "::error::revision غير صالح"; exit 1; }
          [[ "$SLUG" == "success-that-does-not-bring-joy-to-its-ownerarabic" ]] || { echo "::error::التجربة الأولى مقفولة على الحلقة المعتمدة فقط"; exit 1; }
          echo "RELEASED_SLUGS=$SLUG" >> "$GITHUB_ENV"
          echo "DIALOGUE_REVISION=$REVISION" >> "$GITHUB_ENV"

      - name: Write Firebase service account
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || { echo "::error::Firebase service account missing"; exit 1; }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > sa.json
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DRAHMAD_8E9E2 }}

      - name: Validate the complete Kuwaiti library
        run: npm run podcast:kw:self-test

      # المتغيّران يركبان هذه الخطوة نفسها: fetch هو مَن يقرأ حالة الإنتاج
      # ويحتاج إذن الاستبدال. كانا على الخطوة التالية — انزاحا حين أُدرجت
      # خطوةُ قراءة البصمة بينهما، فصار fetch يسقط عند «awaiting_approval»
      # مهما مرّرتَ regenerate. عطبٌ من صنعي، وهذا موضعه الصحيح.
      - name: Lock the exact Kuwaiti admin dialogue
        run: node scripts/fetch-kuwaiti-dialogues.mjs --slugs="$RELEASED_SLUGS"

      # [٢١ أغسطس ٢٠٢٦ — قفل «الكمال» للمقالات القادمة] لا كلمة تصل
      # المحرك قبل أذن الدكتور: أي مفردة في الحوار المجلوب ليست من المتن
      # المعتمد أو المعجم توقف التوليد وتُعرض بجملتها ليحسمها المختبر.
      # الكلمة لا تعتمد إلا لما تثبت في معجمه — هذا الباب الوحيد.
      - name: حارس الكلمات الجديدة — لا جديد قبل أذن الدكتور
        run: node scripts/guard-new-dialogue-words.mjs --dir=manual-dialogues-kuwaiti
        env:
          FIREBASE_SERVICE_ACCOUNT: sa.json
          PODCAST_KW_REGENERATE: ${{ inputs.regenerate && '1' || '' }}

      # بصمة الحوار تُقرأ من القفل الذي كتبه fetch من Firestore نفسه، لا من
      # قيمةٍ تُكتب باليد. العلّة التي أنتجت هذه الخطوة: بصمة Firestore تُحسب
      # على مستند الحوار بحقوله كاملةً، وبصمة ملف المستودع تُحسب على المتن
      # وحده — فتختلفان وإن كان النصّ متطابقاً حرفاً بحرف (تحقّقنا: ٣٧ دوراً
      # متطابقة تماماً). فكانت كل تشغيلةٍ تسقط في خطوتها الأخيرة بعد أن يكون
      # الصوت قد وُلد وسُلّم إلى R2 — يضيع الوقت والحصة، ولا يصل المرشّح إلى
      # بوابة الاعتماد. ومع ١٤٣ حلقة كان هذا سيعني ١٤٣ سقطة.
      - name: Read the revision the generator will actually use
        shell: bash
        run: |
          set -euo pipefail
          LOCK="podcast-audits/source-locks-kuwaiti/$RELEASED_SLUGS.json"
          test -f "$LOCK" || { echo "::error::قفل المصدر مفقود: $LOCK"; exit 1; }
          LOCKED="$(node -e "process.stdout.write(String(JSON.parse(require('fs').readFileSync('$LOCK','utf8')).revisionId||''))")"
          [[ "$LOCKED" =~ ^[A-Za-z0-9._:-]{8,128}$ ]] || { echo "::error::معرّف المراجعة في القفل غير صالح"; exit 1; }
          if [ "$LOCKED" != "$DIALOGUE_REVISION" ]; then
            echo "::notice::بصمة القفل ($LOCKED) تخالف المُمرَّرة ($DIALOGUE_REVISION) — تُعتمد بصمة القفل لأنها ما يولّد عنه المحرّك."
          fi
          echo "DIALOGUE_REVISION=$LOCKED" >> "$GITHUB_ENV"
        env:
          FIREBASE_SERVICE_ACCOUNT: sa.json
          # لا يُستبدل مرشّحٌ ينتظر الاعتماد إلا بطلبٍ صريح من مُطلِق التشغيلة.
          PODCAST_KW_REGENERATE: ${{ inputs.regenerate && '1' || '' }}

      - name: Mark Gemini generation
        run: node scripts/podcast-production-status.mjs --variant=kuwaiti --status=processing --stage=generating_audio --slugs="$RELEASED_SLUGS" --note="قُفل النص الكويتي وبدأ Gemini 3.1 Flash TTS متعدد المتحدثين في Staging."
        env:
          FIREBASE_SERVICE_ACCOUNT: sa.json

      # المحرّك يخرج بالرمز ٣ حين تسقط فجوة الحنجرتين تحت العتبة — عيّنةٌ
      # سيئة تُرمى وتُعاد. ثلاث محاولات؛ والأخيرة بلا عتبة (MIN_GAP=0) حتى
      # لا نبقى بلا حلقة إن كان اليوم كله سيئاً. أي رمزٍ آخر يُسقط الخطوة فوراً.
      - name: Generate Kuwaiti candidate with Gemini 3.1 Flash TTS
        shell: bash
        run: |
          set -uo pipefail
          # GitHub يشغّل الخطوة بـ«bash -e»، و«set -uo pipefail» لا يُطفئ الـ-e.
          # فحين خرج المحرّك بالرمز ٣ (رفضُ عيّنة) قتل الـ-e السكربت قبل فحص
          # الرمز، فسقطت التشغيلة بدل أن تُعيد — ٢٠ أغسطس ٢٠٢٦، run 32412429765.
          # «set +e» صريحةً هي العلاج: نحن نفحص كل رمزٍ بأنفسنا هنا.
          set +e
          ATTEMPTS=3
          BASE_GAP="$PODCAST_KW_MIN_GAP"
          # بيك أوف الحلقة (٢١ أغسطس ٢٠٢٦): العيّنة تتذبذب بين التشغيلات
          # والمدخل واحد (طبقة variance في المعجم مبرهنة). فبدل محاربة
          # التذبذب نحصده: نولّد نسخاً كاملة ويختار الدكتور أفضلها بأذنه —
          # نفس نمط بيك أوف الأصوات الذي اختار Zephyr.
          TAKES="${PODCAST_KW_TAKES:-1}"
          case "$TAKES" in 1|2|3) ;; *) TAKES=1 ;; esac
          for t in $(seq 1 "$TAKES"); do
            ACCEPTED=0
            for i in $(seq 1 $ATTEMPTS); do
              if [ "$i" -eq "$ATTEMPTS" ]; then
                echo "نسخة $t/$TAKES · المحاولة $i/$ATTEMPTS — الأخيرة، تُقبل كما هي بلا عتبة."
                export PODCAST_KW_MIN_GAP=0
              else
                # العتبة تُعاد لكل محاولة: تصفيرها في المحاولة الأخيرة كان
                # سيتسرب إلى النسخ التالية فتُقبل عيّناتها السيئة بلا فحص.
                export PODCAST_KW_MIN_GAP="$BASE_GAP"
                echo "نسخة $t/$TAKES · المحاولة $i/$ATTEMPTS — العتبة $PODCAST_KW_MIN_GAP هرتزاً."
              fi
              node scripts/podcast-kuwaiti-gemini.mjs --slug="$RELEASED_SLUGS"
              CODE=$?
              if [ "$CODE" -eq 0 ]; then
                echo "✓ نسخة $t: قُبلت في المحاولة $i."
                ACCEPTED=1
                break
              fi
              if [ "$CODE" -ne 3 ]; then
                echo "::error::سقط التوليد بالرمز $CODE — ليس رفضَ عيّنة."
                exit "$CODE"
              fi
            done
            if [ "$ACCEPTED" -ne 1 ]; then
              echo "::error::النسخة $t: لم تُقبل أي عيّنة بعد $ATTEMPTS محاولات."
              exit 1
            fi
            if [ "$TAKES" -gt 1 ]; then
              cp "audio/$RELEASED_SLUGS.dialogue-kw.mp3" "audio/$RELEASED_SLUGS.dialogue-kw.take$t.mp3"
              cp "audio/$RELEASED_SLUGS.dialogue-kw.json" "audio/$RELEASED_SLUGS.dialogue-kw.take$t.json"
            fi
          done
          # [٢١ أغسطس ٢٠٢٦ ليلاً — علاج «رفض ينزلها»] كان الملف المعتمد
          # يُرجَّع للنسخة الأولى، بينما سجل البصمات (audit) يحمل بصمة
          # النسخة الأخيرة التي ولّدها المحرك — فتعارضت البصمتان وسقط
          # record-kuwaiti-candidate بـ«مرشح لا يطابق قفل المصدر/بصماته»
          # (تشغيلة 32513812990). الصواب: الملف المعتمد يبقى النسخة
          # الأخيرة كما تركها المحرك (بصمتها هي المسجلة)، والنسخ كلها
          # مرفوعة للمفاضلة بالأذن، وحين يختار الدكتور غيرها تُرقّى.
          exit 0
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_MODEL: gemini-3.1-flash-tts-preview
          PODCAST_KW_PROFILE: kuwaiti-urban-soft-v2
          PODCAST_KW_GENERATION_MODE: pilot
          PODCAST_KW_PILOT_SLUG: success-that-does-not-bring-joy-to-its-ownerarabic
          PODCAST_KW_MIN_GAP: '12'
          # [٢١ أغسطس ٢٠٢٦] مقترح الدكتور: كل جسرٍ موسيقيّ يبدأ نداءً جديداً
          # فترجع «روح البداية» بعد كل موسيقى، ونقطة اللحام تختبئ خلف الجسر.
          # عدد الإعادات بيده: خانة «موسيقى» في محرر اللوحة لكل دور.
          PODCAST_KW_SPLIT_AT_BRIDGES: '1'
          PODCAST_KW_TAKES: ${{ inputs.takes || '1' }}

      - name: Upload candidate to isolated R2 staging
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="staging/kuwaiti/$RELEASED_SLUGS/$DIALOGUE_REVISION"
          AWS=(aws --endpoint-url "$CLOUDFLARE_R2_ENDPOINT" s3api)
          "${AWS[@]}" put-object --bucket "$CLOUDFLARE_R2_BUCKET" --key "$PREFIX/$RELEASED_SLUGS.dialogue-kw.mp3" --body "audio/$RELEASED_SLUGS.dialogue-kw.mp3" --content-type audio/mpeg --cache-control no-store
          "${AWS[@]}" put-object --bucket "$CLOUDFLARE_R2_BUCKET" --key "$PREFIX/$RELEASED_SLUGS.dialogue-kw.json" --body "audio/$RELEASED_SLUGS.dialogue-kw.json" --content-type application/json --cache-control no-store
          "${AWS[@]}" put-object --bucket "$CLOUDFLARE_R2_BUCKET" --key "$PREFIX/$RELEASED_SLUGS.audit.json" --body "podcast-audits/kuwaiti/$RELEASED_SLUGS.json" --content-type application/json --cache-control no-store
          # نسخ البيك أوف إن وُجدت — تُرفع للمفاضلة بالأذن ولا تمس الملف المعتمد
          for f in audio/"$RELEASED_SLUGS".dialogue-kw.take*.mp3; do
            [ -f "$f" ] || continue
            "${AWS[@]}" put-object --bucket "$CLOUDFLARE_R2_BUCKET" --key "$PREFIX/$(basename "$f")" --body "$f" --content-type audio/mpeg --cache-control no-store
            echo "⬆ نسخة بيك أوف: $PREFIX/$(basename "$f")"
          done
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
          CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
          CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}

      # ملخّصٌ يُقرأ من صفحة التشغيلة بلا فتح سجل: الدكتور يسأل «ليش يفشل وما
      # يظهر لي شي؟» — فيظهر هنا رابط الصوت وقراءة البوابتين مهما كانت النتيجة.
      - name: Publish a readable summary
        if: always()
        shell: bash
        run: |
          AUDIT="podcast-audits/kuwaiti/$RELEASED_SLUGS.json"
          {
            echo "## الحلقة الكويتية — $RELEASED_SLUGS"
            if [ -f "audio/$RELEASED_SLUGS.dialogue-kw.mp3" ]; then
              SIZE=$(du -h "audio/$RELEASED_SLUGS.dialogue-kw.mp3" | cut -f1)
              echo "**الصوت وُلد بنجاح** ($SIZE) — وهو على R2 حتى لو سقطت خطوةٌ بعده:"
              echo '```'
              echo "$AUDIO_PUBLIC_BASE_URL/staging/kuwaiti/$RELEASED_SLUGS/$DIALOGUE_REVISION/$RELEASED_SLUGS.dialogue-kw.mp3"
              echo '```'
            else
              echo "**لم يُولَّد صوت** — العطب قبل التوليد."
            fi
            if [ -f "$AUDIT" ]; then
              echo ""
              echo "| القياس | القيمة |"
              echo "|---|---|"
              node -e "
                const a=require('./$AUDIT');
                const p=a.pitchGate||{}, r=a.repeatGate||{};
                console.log('| المدة | '+Math.round(a.durationSec||0)+' ثانية |');
                console.log('| الأدوار | '+(a.turnCount||0)+' |');
                console.log('| النداءات | '+(a.chunkCount||0)+' |');
                console.log('| وسيط فهد / نورة | '+(p.maleMedianHz||'—')+' / '+(p.femaleMedianHz||'—')+' هرتز |');
                console.log('| أدوار مشتبهة بالنبرة | '+((p.suspects||[]).length)+' |');
                console.log('| أدوار شاذة زمنياً | '+((r.suspects||[]).length)+' |');
              " || echo "| — | تعذّرت قراءة السجل |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          AUDIO_PUBLIC_BASE_URL: ${{ vars.AUDIO_PUBLIC_BASE_URL }}

      - name: Expose candidate only to the admin review state
        run: node scripts/record-kuwaiti-candidate.mjs --slug="$RELEASED_SLUGS" --revision="$DIALOGUE_REVISION"
        env:
          FIREBASE_SERVICE_ACCOUNT: sa.json
          AUDIO_PUBLIC_BASE_URL: ${{ vars.AUDIO_PUBLIC_BASE_URL }}

      - name: Mark failed for review
        if: failure()
        continue-on-error: true
        run: node scripts/podcast-production-status.mjs --variant=kuwaiti --status=needs_review --stage=failed --slugs="$RELEASED_SLUGS" --note="توقف توليد Gemini الكويتي أو رفع Staging؛ بقيت الفصحى والنسخة المنشورة السابقة بلا تغيير."
        env:
          FIREBASE_SERVICE_ACCOUNT: sa.json

      - name: Preserve pilot files for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kuwaiti-pilot-${{ inputs.slugs }}
          if-no-files-found: warn
          path: |
            audio/${{ inputs.slugs }}.dialogue-kw.mp3
            audio/${{ inputs.slugs }}.dialogue-kw.json
            podcast-audits/kuwaiti/${{ inputs.slugs }}.json
