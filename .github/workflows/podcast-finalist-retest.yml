name: إعادة اختبار D و B للحوار

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: podcast-finalist-retest
  cancel-in-progress: false

jobs:
  finalist-retest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Force public npm registry
        run: |
          npm config set registry https://registry.npmjs.org/
          node scripts/normalize-npm-registry.mjs

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org/ --prefer-online --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify required secrets
        run: |
          if [ -z "$AZURE_SPEECH_KEY" ]; then
            echo "::error::Missing AZURE_SPEECH_KEY"
            exit 1
          fi
          if [ -z "$AZURE_SPEECH_REGION" ]; then
            echo "::error::Missing AZURE_SPEECH_REGION"
            exit 1
          fi
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}

      - name: Generate slower D/B finalist samples
        run: node scripts/podcast-dialogue.mjs --voice-finalist-retest
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}

      - name: Upload finalist samples and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: podcast-finalist-retest-output
          path: |
            public/audio/audition-finalists
            podcast-audits/voice-finalist-retest.private.json
          if-no-files-found: warn
          retention-days: 7
