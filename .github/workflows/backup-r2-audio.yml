name: درع الصوت — مرآة R2 إلى الباكت الخاصّ

# الصوت (R2) كان بلا أي نسخة؛ هذا يمرآته إلى باكت النسخ الخاصّ.
# ملاحظة صدق: نسخةٌ ثانية داخل Cloudflare نفسها (ليست مستقلة عن المزوّد) —
# تحمي من الدهس/الحذف العرضي لا من ضياع الحساب. للاستقلال الكامل: مرآة محلية/GCS لاحقاً.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 0'   # أسبوعياً الأحد 04:00 UTC = 07:00 الكويت

concurrency:
  group: backup-r2-audio
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: قياس الحجم + حارس الحصة المجانية (يتوقّف قبل أي كلفة)
        run: |
          SRC="${{ vars.CLOUDFLARE_R2_BUCKET }}"
          RAW=$(aws s3 ls "s3://$SRC" --recursive --summarize --endpoint-url "${{ secrets.CLOUDFLARE_R2_ENDPOINT }}" | grep 'Total Size' | awk '{print $NF}')
          echo "audio bytes: ${RAW:-0}"
          GB=$(( ${RAW:-0} / 1073741824 ))
          echo "≈ ${GB} GiB"
          if [ "$GB" -gt 8 ]; then
            echo "::error::الصوت ${GB} جيجا — يقارب حصة R2 المجانية (١٠ج). المرآة قد تُكلّف. راجع قبل المتابعة."
            exit 1
          fi
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'

      - name: تنزيل الصوت من الباكت العام (بلا مسار backups)
        run: |
          aws s3 sync "s3://${{ vars.CLOUDFLARE_R2_BUCKET }}" ./audio-mirror \
            --endpoint-url "${{ secrets.CLOUDFLARE_R2_ENDPOINT }}" --no-progress --exclude "backups/*"
          echo "downloaded: $(du -sh ./audio-mirror | cut -f1) · files: $(find ./audio-mirror -type f | wc -l)"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'

      - name: رفع إلى الباكت الخاصّ dr-ahmad-backups تحت audio-mirror/
        run: |
          aws s3 sync ./audio-mirror "s3://${{ vars.CLOUDFLARE_R2_BACKUP_BUCKET }}/audio-mirror" \
            --endpoint-url "${{ secrets.CLOUDFLARE_R2_BACKUP_ENDPOINT }}" --no-progress
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_BACKUP_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'

      - name: التحقّق — مطابقة عدد الملفات المصدر/الوجهة
        continue-on-error: true
        run: |
          SRCN=$(aws s3 ls "s3://${{ vars.CLOUDFLARE_R2_BUCKET }}" --recursive --endpoint-url "${{ secrets.CLOUDFLARE_R2_ENDPOINT }}" | grep -v ' backups/' | grep -c '')
          aws configure set default.s3.addressing_style path
          DSTN=$(AWS_ACCESS_KEY_ID="${{ secrets.CLOUDFLARE_R2_BACKUP_ACCESS_KEY_ID }}" AWS_SECRET_ACCESS_KEY="${{ secrets.CLOUDFLARE_R2_BACKUP_SECRET_ACCESS_KEY }}" aws s3 ls "s3://${{ vars.CLOUDFLARE_R2_BACKUP_BUCKET }}/audio-mirror/" --recursive --endpoint-url "${{ secrets.CLOUDFLARE_R2_BACKUP_ENDPOINT }}" | grep -c '')
          echo "source(non-backups): $SRCN · mirror: $DSTN"
          {
            echo "## درع الصوت — مرآة R2"
            echo "- المصدر (بلا backups): **$SRCN** ملف"
            echo "- المرآة في الباكت الخاصّ: **$DSTN** ملف"
            if [ "$DSTN" -ge "$SRCN" ]; then echo "- الحالة: ✅ المرآة مكتملة"; else echo "- الحالة: ⚠️ نقص — راجع"; fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
