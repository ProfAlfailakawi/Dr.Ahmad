name: تجربة سماع الحلقة الحوارية

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Slug لمقال محدد. اتركه فارغًا لتجربة أحدث مقال."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: podcast-dialogue-trial
  cancel-in-progress: false

jobs:
  trial:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Force public npm registry
        run: |
          npm config set registry https://registry.npmjs.org/
          node scripts/normalize-npm-registry.mjs

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org/ --prefer-online --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify required secrets
        run: |
          if [ -z "$AZURE_SPEECH_KEY" ]; then
            echo "::error::Missing AZURE_SPEECH_KEY"
            exit 1
          fi
          if [ -z "$AZURE_SPEECH_REGION" ]; then
            echo "::error::Missing AZURE_SPEECH_REGION"
            exit 1
          fi
          if [ -z "$GEMINI_API_KEY" ] && [ -z "$GOOGLE_API_KEY" ]; then
            echo "::error::Missing GEMINI_API_KEY or GOOGLE_API_KEY"
            exit 1
          fi
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      - name: Generate trial dialogue episode
        run: |
          if [ -n "$SLUG" ]; then
            node scripts/podcast-dialogue.mjs --lang=ar --trial --force --slug="$SLUG"
          else
            node scripts/podcast-dialogue.mjs --lang=ar --trial --force --latest=1
          fi
        env:
          SLUG: ${{ inputs.slug }}
          PODCAST_TRIAL: "1"
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      - name: Upload trial audio and transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: podcast-dialogue-trial-output
          path: |
            audio/*.dialogue.mp3
            audio/*.dialogue.json
            podcast-audits/*.ar.json
            .podcast-state.json
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true
