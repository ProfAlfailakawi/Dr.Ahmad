    <script id="canonical-host-redirect">
      (function () {
        var canonicalHost = 'dr-alfailakawi.com';
        var legacyHosts = {
          'www.dr-alfailakawi.com': true,
          'dr-alfailakawi.web.app': true,
          'dr-alfailakawi.firebaseapp.com': true,
        };
        var host = window.location.hostname.toLowerCase();
        if (legacyHosts[host] || (host === canonicalHost && window.location.protocol !== 'https:')) {
          window.location.replace('https://' + canonicalHost + window.location.pathname + window.location.search + window.location.hash);
        }
      })();
    </script>
    <script id="theme-init">
      (function () {
        try {
          // الوضع النهاري هو الأصل دائماً — الليلي فقط إذا اختاره الزائر بنفسه
          if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <!--
      نسخة الـSEO الثابتة تُحفظ خارج جذر React كي تفهمها محركات البحث،
      لكنها لا تُعرض للزائر أثناء إقلاع التطبيق. إذا تعذر JavaScript فعلاً،
      تُكشف النسخة الثابتة تلقائياً بعد مهلة أمان بدل ترك صفحة فارغة.
    -->
    <script id="app-boot-state">
      (function () {
        var html = document.documentElement;
        html.classList.add('js');
        window.__appBootFallbackTimer = window.setTimeout(function () {
          if (!html.hasAttribute('data-app-ready')) html.classList.remove('js');
        }, 8000);
      })();
    </script>
    <style id="app-boot-style">
      html, body { background: #FCFCFA; }
      html.dark, html.dark body { background: #111215; }
      html.js #seo-fallback { display: none !important; }
      #root:empty { min-height: 100svh; }
    </style>

    <meta name="description" content="الموقع الرسمي للدكتور أحمد حسين الفيلكاوي، أستاذ تكنولوجيا التعليم والذكاء الاصطناعي، ويضم مؤلفاته وأبحاثه ومقالاته الفكرية في التعليم والتقنية والمجتمع." />

  <body>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        if (location.hostname.includes('ais-dev-') || location.hostname.includes('localhost') || location.hostname.includes('127.0.0.1')) {
          navigator.serviceWorker.getRegistrations().then(function (registrations) {
            for (var registration of registrations) {
              registration.unregister();
            }
          });
          if ('caches' in window) {
            caches.keys().then(function (keys) {
              keys.forEach(function (key) {
                caches.delete(key);
              });
            });
          }
        } else if (location.protocol === 'https:') {
          var isAdmin = location.pathname === '/admin' || location.pathname.startsWith('/admin/');
          // لوحة التحكم: إن تولّى عامل خدمة جديد التحكّم (بعد نشر جديد) نُعيد التحميل مرة
          // واحدة فوراً لتُخدَم أحدث نسخة — فلا يعلق الدكتور على لوحة قديمة معطوبة.
          // (الحارس controller يمنع إعادة التحميل عند أول تثبيت، والعلم يمنع أي حلقة.)
          if (isAdmin && navigator.serviceWorker.controller) {
            var swReloaded = false;
            navigator.serviceWorker.addEventListener('controllerchange', function () {
              if (swReloaded) return;
              swReloaded = true;
              location.reload();
            });
          }
          window.addEventListener('load', function () {
            navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).then(function (registration) {
              // لوحة التحكم تطلب أحدث عامل خدمة فوراً حتى لا تبقى نسخة قديمة تستدعي مسار رفع 413 الملغى.
              if (isAdmin) {
                registration.update().catch(function () {});
              }
            }).catch(function () {});
          });
          // الصفحات العامة: التحديث الجديد يُستخدم في الزيارة التالية بلا إعادة تحميل مفاجئة.
        }
      }
    </script>
